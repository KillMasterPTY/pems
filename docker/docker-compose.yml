networks:
  pems-network:
    driver: bridge

services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pems
      POSTGRES_USER: pems
      POSTGRES_PASSWORD: pems123
    volumes:
      - /opt/pems/data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pems -d pems"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: rodrigo.mckay@falcon.com.pa
      PGADMIN_DEFAULT_PASSWORD: Admin123!
    ports:
      - "5050:80"
    networks:
      - pems-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pems-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pems
      RABBITMQ_DEFAULT_PASS: Rabbit123!
    volumes:
      - /opt/pems/data/rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pems-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pems
      KC_DB_USERNAME: pems
      KC_DB_PASSWORD: pems123
    ports:
      - "8080:8080"
    networks:
      - pems-network
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: Minio123!
    volumes:
      - /opt/pems/data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - pems-network
